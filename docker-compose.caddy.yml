services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      EVIDENCE_MODE: ${EVIDENCE_MODE:-online_with_empty_fallback}
      EVIDENCE_DATA_DIR: /data/evidence
      REFERENCE_DATA_DIR: /app/references
      USER_REFERENCE_DATA_DIR: /data/evidence/reference-datasets
      GBIF_BASE_URL: ${GBIF_BASE_URL:-https://api.gbif.org/v1}
      GBIF_BACKBONE_ENRICH_UPLOADS: ${GBIF_BACKBONE_ENRICH_UPLOADS:-true}
      BARCODE_SEARCH_BACKEND: ${BARCODE_SEARCH_BACKEND:-auto}
      BARCODE_SEARCH_TIMEOUT_SECONDS: ${BARCODE_SEARCH_TIMEOUT_SECONDS:-30}
      MAX_PYTHON_SEARCH_COMPARISONS: ${MAX_PYTHON_SEARCH_COMPARISONS:-50000000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://ecooddworld.eu,https://www.ecooddworld.eu}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:-}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:-}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-true}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_AUTH_PROTECT_RUN_READS: ${API_AUTH_PROTECT_RUN_READS:-true}
      API_RATE_LIMIT_READ_PER_MINUTE: ${API_RATE_LIMIT_READ_PER_MINUTE:-240}
      API_RATE_LIMIT_WRITE_PER_MINUTE: ${API_RATE_LIMIT_WRITE_PER_MINUTE:-20}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-12582912}
      API_MAX_CSV_UPLOAD_BYTES: ${API_MAX_CSV_UPLOAD_BYTES:-2097152}
      API_MAX_REFERENCE_UPLOAD_BYTES: ${API_MAX_REFERENCE_UPLOAD_BYTES:-10485760}
      API_MAX_CONCURRENT_HEAVY_REQUESTS: ${API_MAX_CONCURRENT_HEAVY_REQUESTS:-2}
      REFERENCE_UPLOADS_ENABLED: ${REFERENCE_UPLOADS_ENABLED:-false}
      ECOGENESIS_EVIDENCE_ATTESTATION_SECRET: ${ECOGENESIS_EVIDENCE_ATTESTATION_SECRET:-}
      ECOGENESIS_EVIDENCE_ATTESTATION_KEY_ID: ${ECOGENESIS_EVIDENCE_ATTESTATION_KEY_ID:-configured-local-hmac-v1}
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "8000"
    volumes:
      - ./data:/data/evidence
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile.caddy
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
