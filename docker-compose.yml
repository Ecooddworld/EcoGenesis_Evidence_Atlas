services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      EVIDENCE_MODE: ${EVIDENCE_MODE:-online_with_empty_fallback}
      EVIDENCE_DATA_DIR: /data/evidence
      REFERENCE_DATA_DIR: /app/references
      USER_REFERENCE_DATA_DIR: /data/evidence/reference-datasets
      GBIF_BASE_URL: ${GBIF_BASE_URL:-https://api.gbif.org/v1}
      GBIF_BACKBONE_ENRICH_UPLOADS: ${GBIF_BACKBONE_ENRICH_UPLOADS:-true}
      BARCODE_SEARCH_BACKEND: ${BARCODE_SEARCH_BACKEND:-auto}
      BARCODE_SEARCH_TIMEOUT_SECONDS: ${BARCODE_SEARCH_TIMEOUT_SECONDS:-30}
      MAX_PYTHON_SEARCH_COMPARISONS: ${MAX_PYTHON_SEARCH_COMPARISONS:-50000000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:13100,http://127.0.0.1:13100}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-false}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_AUTH_PROTECT_RUN_READS: ${API_AUTH_PROTECT_RUN_READS:-false}
      API_RATE_LIMIT_READ_PER_MINUTE: ${API_RATE_LIMIT_READ_PER_MINUTE:-240}
      API_RATE_LIMIT_WRITE_PER_MINUTE: ${API_RATE_LIMIT_WRITE_PER_MINUTE:-30}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-12582912}
      API_MAX_CSV_UPLOAD_BYTES: ${API_MAX_CSV_UPLOAD_BYTES:-2097152}
      API_MAX_REFERENCE_UPLOAD_BYTES: ${API_MAX_REFERENCE_UPLOAD_BYTES:-10485760}
      API_MAX_CONCURRENT_HEAVY_REQUESTS: ${API_MAX_CONCURRENT_HEAVY_REQUESTS:-4}
      REFERENCE_UPLOADS_ENABLED: ${REFERENCE_UPLOADS_ENABLED:-true}
      ECOGENESIS_EVIDENCE_ATTESTATION_SECRET: ${ECOGENESIS_EVIDENCE_ATTESTATION_SECRET:-}
      ECOGENESIS_EVIDENCE_ATTESTATION_KEY_ID: ${ECOGENESIS_EVIDENCE_ATTESTATION_KEY_ID:-configured-local-hmac-v1}
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "${BACKEND_PORT:-18100}:8000"
    volumes:
      - evidence_data:/data/evidence
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    ports:
      - "${FRONTEND_PORT:-13100}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0750
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0750
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

volumes:
  evidence_data:
