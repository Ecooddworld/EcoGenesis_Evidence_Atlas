name: Exact-commit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecogenesis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/requirements-audit.lock
      - name: Verify dependency lock consistency
        run: python backend/scripts/verify_dependency_locks.py
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
      - name: Check dependency resolution
        run: python -m pip check
      - name: Install locked dependency-audit toolchain
        run: |
          python -m venv /tmp/pip-audit
          /tmp/pip-audit/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-audit.lock
      - name: Regenerate dependency locks and reject drift
        working-directory: backend
        run: |
          /tmp/pip-audit/bin/python -m piptools compile --quiet --generate-hashes --no-strip-extras --output-file=requirements.lock requirements.txt
          /tmp/pip-audit/bin/python -m piptools compile --quiet --generate-hashes --no-strip-extras --output-file=requirements-dev.lock requirements-dev.txt
          /tmp/pip-audit/bin/python -m piptools compile --quiet --allow-unsafe --generate-hashes --no-strip-extras --output-file=requirements-audit.lock requirements-audit.txt
          git diff --exit-code -- requirements.lock requirements-dev.lock requirements-audit.lock
      - name: Audit Python dependencies
        run: |
          /tmp/pip-audit/bin/python -m pip_audit -r backend/requirements-dev.lock
          /tmp/pip-audit/bin/python -m pip_audit -r backend/requirements-audit.lock
      - name: Lint backend and check Python syntax
        working-directory: backend
        run: |
          python -m ruff check app scripts tests
          python -m compileall -q app scripts
      - name: Run backend regression suite
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend tests, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit Node dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend regression suite
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  regenerate:
    name: Regenerate and verify evidence artifacts
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
      - name: Regenerate competition batches
        working-directory: backend
        run: python scripts/generate_competition_reports.py
      - name: Regenerate explicitly synthetic ambiguity stress report
        working-directory: backend
        run: python scripts/run_synthetic_ambiguity_benchmark.py --records 120 --output-dir ../reports/synthetic-ambiguity-benchmark
      - name: Regenerate and verify Evidence Map outputs
        working-directory: backend
        run: |
          python scripts/generate_observatory_demo_report.py
          python scripts/verify_observatory_outputs.py
      - name: Run formula and operability checks
        working-directory: backend
        run: |
          python scripts/verify_math_viability.py
          python scripts/verify_barcode_operability.py
      - name: Record exact-commit provenance and checksums
        run: |
          mkdir -p /tmp/ecogenesis-ci
          printf '{"git_sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > /tmp/ecogenesis-ci/build-provenance.json
          find reports/competition-100-sequences reports/adversarial-100-sequences reports/synthetic-ambiguity-benchmark reports/observatory-demo reports/barcode-operability reports/math-viability-audit -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/ecogenesis-ci/generated-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regenerated-evidence-${{ github.sha }}
          path: |
            /tmp/ecogenesis-ci/build-provenance.json
            /tmp/ecogenesis-ci/generated-sha256.txt
            reports/competition-100-sequences
            reports/adversarial-100-sequences
            reports/synthetic-ambiguity-benchmark
            reports/observatory-demo
            reports/barcode-operability
            reports/math-viability-audit
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker smoke and container scan
    needs: [backend, frontend, regenerate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.caddy.yml config --quiet
      - name: Run production-image smoke test
        run: scripts/docker_smoke.sh
      - name: Build Caddy production frontend image
        run: docker build -f frontend/Dockerfile.caddy -t ecogenesis-docker-smoke-caddy .
      - name: Scan backend image for fixable critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity CRITICAL
          ecogenesis-docker-smoke-backend:latest
      - name: Scan frontend image for fixable critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity CRITICAL
          ecogenesis-docker-smoke-frontend:latest
      - name: Scan Caddy frontend image for fixable critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity CRITICAL
          ecogenesis-docker-smoke-caddy:latest

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          category: /language:combined
